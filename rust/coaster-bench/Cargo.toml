[package]
name = "coaster-bench"
version = "0.1.0"
edition = "2021"
description = "Orchestrates CoasterBench runs: game MCP server + sandboxed Claude Code per round"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
