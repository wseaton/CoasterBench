name: CoasterBench Site
on:
  push:
    branches: [eval]
    paths:
      - 'evals/**'
      - 'rust/coaster-site/**'
      - '.github/workflows/coasterbench-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/coaster-site
      - name: Build site
        # --cf-images: a CI build has no local artifacts to downscale, so the
        # captures are resized at the edge instead of served whole.
        run: cargo run --release --manifest-path rust/coaster-site/Cargo.toml -- --cf-images
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: evals/site
      - id: deployment
        uses: actions/deploy-pages@v5
